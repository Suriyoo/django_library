{% extends "base_generic.html" %}

{% block content %}

<h1>Languages</h1>

{% if language_list %}
    <ul>
        {% for language in language_list %}
            <li>
                {{ language.name }}
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No languages available.</p>
{% endif %}

{% endblock %}
