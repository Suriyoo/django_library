{% extends "base_generic.html" %}

{% block content %}

<h1>Genres</h1>

{% if genre_list %}
    <ul>
        {% for genre in genre_list %}
            <li>
                {{ genre.name }}
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No genres available.</p>
{% endif %}

{% endblock %}
